# This workflow is manual-only - nothing runs on push (tag or otherwise).
# Releases are created by hand from the GitHub UI; this workflow's job is
# only to build artifacts and, if you ask it to, attach them to a release
# that already exists for the tag you pick.
#
# Typical flow: create the release from the GitHub UI (Releases -> Draft a
# new release, picking/creating the tag) first, then come here and trigger
# "Run workflow" - pick that same tag from the "Use workflow from" dropdown,
# check "Build macOS (signed + notarized)" and "Create/update the GitHub
# Release", and run it. That builds a real, Apple-notarized macOS build and
# attaches it straight to the release you just created.
#
# Signing requires five repo secrets, none of which this workflow can set
# up for you:
#   APPLE_CERTIFICATE_P12          - base64 of a .p12 containing BOTH your
#                                     "Developer ID Application" and
#                                     "Developer ID Installer" certs+keys
#                                     (export both together from Keychain
#                                     Access), e.g. `base64 -i cert.p12 | pbcopy`
#   APPLE_CERTIFICATE_PASSWORD     - the password you set when exporting the .p12
#   APPLE_TEAM_ID                  - your 10-character Apple Developer Team ID
#   APPLE_ID                       - your Apple ID email
#   APPLE_APP_SPECIFIC_PASSWORD    - an app-specific password from
#                                     appleid.apple.com (Sign-In and Security >
#                                     App-Specific Passwords) - NOT your real
#                                     Apple ID password
#
# Leaving "Create/update the GitHub Release" unchecked just uploads workflow
# artifacts (Actions tab) without touching any release - useful for test
# builds. The four build_* checkboxes let you pick exactly which targets to
# build, so you're not stuck waiting on ones you don't need.
#
# macOS ships two separate apps (see pyproject.toml): "uwmedia" (plain GUI,
# .dmg, installs to /Applications - what most users want) and
# "uwmedia-terminal" (CLI + GUI hybrid, .pkg, installs to /Library and adds
# a `uwmedia` command to PATH). Windows/Linux only build uwmedia-terminal,
# since they don't have the same "wrong folder for a normal app" mismatch a
# macOS console app has.

name: Release Build

on:
  workflow_dispatch:
    inputs:
      build_macos_unsigned:
        description: 'Build macOS (ad-hoc/unsigned)'
        type: boolean
        default: true
      build_macos_signed:
        description: 'Build macOS (signed + notarized, requires Apple secrets)'
        type: boolean
        default: false
      build_windows:
        description: 'Build Windows'
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux'
        type: boolean
        default: true
      create_release:
        description: 'Create/update the GitHub Release for the selected tag with whatever gets built (requires picking a tag above, not a branch)'
        type: boolean
        default: false

jobs:
  # The matrix context isn't available in a job-level `if:`, so which
  # targets to build for a manual dispatch has to be decided by computing a
  # matrix upstream, rather than skipping build's matrix entries directly.
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Require a tag ref when creating a release
        if: inputs.create_release && github.ref_type != 'tag'
        run: |
          echo "::error::create_release requires a tag. Re-run 'Run workflow' and pick a tag (e.g. v0.5.1) from the 'Use workflow from' dropdown instead of a branch."
          exit 1

      - id: set-matrix
        run: |
          BUILD_LINUX="${{ inputs.build_linux }}"
          BUILD_WINDOWS="${{ inputs.build_windows }}"
          BUILD_MACOS_UNSIGNED="${{ inputs.build_macos_unsigned }}"
          BUILD_MACOS_SIGNED="${{ inputs.build_macos_signed }}"

          ENTRIES=()

          # Linux "system" packaging builds against the runner's actual
          # system python3 (no bundled/support-package Python like the other
          # platforms use), so this must track ubuntu-latest's system Python
          # (currently 3.12 on the 24.04 image) or Briefcase refuses to build.
          if [ "$BUILD_LINUX" = "true" ]; then
            ENTRIES+=('{"os":"ubuntu-latest","platform":"linux","format":"system","python-version":"3.12","app":"uwmedia-terminal","needs_installer_identity":false,"sign_macos":false}')
          fi

          if [ "$BUILD_WINDOWS" = "true" ]; then
            ENTRIES+=('{"os":"windows-latest","platform":"windows","format":"app","python-version":"3.11","app":"uwmedia-terminal","needs_installer_identity":false,"sign_macos":false}')
          fi

          if [ "$BUILD_MACOS_UNSIGNED" = "true" ]; then
            ENTRIES+=('{"os":"macos-14","platform":"macOS","format":"app","python-version":"3.11","app":"uwmedia-terminal","needs_installer_identity":false,"sign_macos":false}')
            ENTRIES+=('{"os":"macos-14","platform":"macOS","format":"app","python-version":"3.11","app":"uwmedia","needs_installer_identity":false,"sign_macos":false}')
          fi

          if [ "$BUILD_MACOS_SIGNED" = "true" ]; then
            ENTRIES+=('{"os":"macos-14","platform":"macOS","format":"app","python-version":"3.11","app":"uwmedia-terminal","needs_installer_identity":true,"sign_macos":true}')
            ENTRIES+=('{"os":"macos-14","platform":"macOS","format":"app","python-version":"3.11","app":"uwmedia","needs_installer_identity":false,"sign_macos":true}')
          fi

          if [ ${#ENTRIES[@]} -eq 0 ]; then
            echo "::error::No build targets selected - check at least one of the four build_* inputs."
            exit 1
          fi

          JOINED=$(IFS=,; echo "${ENTRIES[*]}")
          echo "matrix={\"include\":[$JOINED]}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: Build (${{ matrix.platform }} - ${{ matrix.app }}${{ matrix.sign_macos && ', signed' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # A signed build should always correspond to a specific version tag -
      # if "Run workflow" was triggered with the branch/tag dropdown left on
      # a branch (e.g. main) instead of a tag, the version-stamping step
      # below silently no-ops and the artifact ships with whatever stale
      # version happens to be in pyproject.toml. Fail loudly instead.
      - name: Require a tag ref for signed builds
        if: matrix.sign_macos && github.ref_type != 'tag'
        run: |
          echo "::error::Signed builds must be run against a tag. Re-run 'Run workflow' and pick a tag (e.g. v0.5.1) from the 'Use workflow from' dropdown instead of a branch."
          exit 1

      - name: Set up Python
        if: matrix.platform != 'linux'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies (Ubuntu)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential \
            pkg-config python3-dev python3-venv libgirepository1.0-dev libgirepository-2.0-dev \
            libcairo2-dev libpango1.0-dev libgtk-3-dev gir1.2-gtk-3.0 \
            libcanberra-gtk3-module

      # Briefcase's Linux "system" format requires the interpreter running
      # Briefcase to be the exact same binary/version as the host's system
      # python3 (it builds/packages against system site-packages, not a
      # bundled Python). actions/setup-python fetches its own separate
      # build, so its version never lines up with apt's python3 patch level.
      # A venv created from system python3 reports that exact same version
      # while still being writable (Ubuntu's system python3 is otherwise
      # "externally managed" and refuses direct pip installs).
      - name: Set up Python (Linux, venv from system python3)
        if: matrix.platform == 'linux'
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Downloads this runner's ffmpeg/ffprobe/exiftool from the "deps"
      # release (see resources/licenses/BINARY_MANIFEST.json and
      # solve_dependencies.md) into resources/bin_<platform>/, checksum-
      # verified - this is what `briefcase build` bundles into the app a
      # few steps down, replacing the old "brew/choco/apt install
      # ffmpeg+exiftool" steps this workflow used to have.
      - name: Fetch vendored ffmpeg/exiftool binaries
        run: python scripts/fetch_vendored_binaries.py

      - name: Set app version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          python -c "
          import os, re, pathlib
          tag_version = os.environ['TAG_REF'].removeprefix('refs/tags/v')
          p = pathlib.Path('pyproject.toml')
          content = re.sub(r'(?m)^version = \".*\"', f'version = \"{tag_version}\"', p.read_text(), count=1)
          p.write_text(content)
          print(f'Set Briefcase app version to {tag_version}')
          "

      - name: Build app with Briefcase
        run: |
          briefcase build ${{ matrix.platform }} ${{ matrix.format }} -a ${{ matrix.app }} --no-input

      # --- macOS signing setup (only for matrix entries with sign_macos) ---
      - name: Import Apple signing certificate
        if: matrix.sign_macos
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -e
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign -T /usr/bin/productbuild
          rm -f "$RUNNER_TEMP/cert.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to the search list without dropping the default keychains
          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed 's/[[:space:]"]//g')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

          # Resolve the exact identity names Briefcase needs to pass to
          # codesign/productsign - read from the keychain rather than
          # requiring you to type your cert's exact common name as a secret.
          APP_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" | grep 'Developer ID Application' | head -1 | sed -E 's/^[[:space:]]*[0-9]+\) [0-9A-F]+ "(.*)"$/\1/')
          if [ -z "$APP_IDENTITY" ]; then
            echo "::error::Could not find a 'Developer ID Application' identity in the imported certificate."
            exit 1
          fi
          echo "APP_IDENTITY=$APP_IDENTITY" >> "$GITHUB_ENV"

          # Only the .pkg (console app) build needs a separate Installer
          # identity - the .dmg build just codesigns+notarizes the .app with
          # the Application identity.
          if [ "${{ matrix.needs_installer_identity }}" = "true" ]; then
            INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" | grep 'Developer ID Installer' | head -1 | sed -E 's/^[[:space:]]*[0-9]+\) [0-9A-F]+ "(.*)"$/\1/')
            if [ -z "$INSTALLER_IDENTITY" ]; then
              echo "::error::Could not find a 'Developer ID Installer' identity in the imported certificate."
              exit 1
            fi
            echo "INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          fi

      - name: Register notarization credentials
        if: matrix.sign_macos
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          # Briefcase looks this profile name up itself - it must be exactly
          # "briefcase-macOS-<team id>" (see SigningIdentity in briefcase's
          # macOS backend).
          xcrun notarytool store-credentials "briefcase-macOS-$APPLE_TEAM_ID" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      - name: Package app with Briefcase (signed + notarized)
        if: matrix.sign_macos
        run: |
          if [ "${{ matrix.needs_installer_identity }}" = "true" ]; then
            briefcase package macOS app -a ${{ matrix.app }} --no-input -i "$APP_IDENTITY" --installer-identity "$INSTALLER_IDENTITY"
          else
            briefcase package macOS app -a ${{ matrix.app }} --no-input -i "$APP_IDENTITY"
          fi

      - name: Clean up signing keychain
        if: always() && matrix.sign_macos
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      # --- Everyone else (and macOS entries that weren't the signed ones) --
      # NOTE: uwmedia-terminal is a console_app, which Briefcase can only
      # distribute on macOS as a signed .pkg installer. Without the real
      # Apple signing above, --adhoc-sign is the only option - and Apple's
      # ad-hoc signing means the resulting package will only install/run on
      # the machine that built it (this CI runner), not on any other Mac.
      - name: Package app with Briefcase (ad-hoc)
        if: "!matrix.sign_macos"
        run: |
          briefcase package ${{ matrix.platform }} ${{ matrix.format }} -a ${{ matrix.app }} --no-input --adhoc-sign

      # Briefcase's Linux "system" .deb filename includes the vendor,
      # codename, and revision (e.g. uwmedia_0.5.6-1~ubuntu-noble_amd64.deb)
      # - shorten it to something more presentable for a release asset.
      - name: Rename Linux package
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          DEB_FILE=$(ls dist/*.deb | head -1)
          mv "$DEB_FILE" "dist/UWMedia-ubuntu-amd64-${VERSION}.deb"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.platform }}
          path: dist/*

  release:
    name: Create Release
    needs: build
    # Only runs if you explicitly checked "Create/update the GitHub Release"
    # on a manual dispatch (against a tag) - releases themselves are always
    # created by hand from the GitHub UI first. Leaving this unchecked never
    # touches the Release page, so it's safe to test builds without risk of
    # clobbering anything already attached.
    if: inputs.create_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          body: |
            - `UWMedia-*.dmg` - macOS app, drag to Applications. No terminal command.
            - `UWMedia-Terminal-*.pkg` - macOS app + a `uwmedia` terminal command for scripted/batch use.
            - `UWMedia-*.msi` - Windows installer. Also adds a `uwmedia` terminal command.
            - `UWMedia-ubuntu-amd64-*.deb` - Linux package. Also adds a `uwmedia` terminal command.

            Only the file(s) attached below are part of this release. macOS
            files are only genuinely signed/notarized if "Build macOS
            (signed + notarized)" was checked for this run - otherwise
            they're ad-hoc and won't open until replaced.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
