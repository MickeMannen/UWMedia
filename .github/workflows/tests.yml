# Runs the default test suite (everything except tests/release_test.py, see
# CONTRIBUTING.md) on macOS, Windows and Linux. It runs on pushes to main and
# on release tags only - development branches never go to GitHub - and can be
# started by hand from the Actions tab.
#
# The tests need no private data: the render tests use the reviewed media in
# tests/fixtures and dive logs generated at run time, and the tests that read
# the owner's test_data/ folder skip themselves when it is missing.

name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]
    env:
      # No display on the runners; Qt renders off screen.
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # The Qt libraries PySide6 loads on Linux, which a bare runner lacks.
      - name: Install Qt system libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The same checksum-verified ffmpeg/ffprobe/exiftool the app ships
      # with (resources/bin_<platform>/, found by utils/dependency_check.py).
      - name: Fetch vendored ffmpeg/exiftool binaries
        run: python scripts/fetch_vendored_binaries.py

      # Run from source, the app finds the tools on PATH only (the bundled
      # folder is looked up in a packaged build), so put that folder first.
      - name: Put the vendored binaries on PATH
        run: >-
          python -c "import os, platform, pathlib;
          d = {'Darwin': 'bin_macos', 'Windows': 'bin_windows', 'Linux': 'bin_linux'}[platform.system()];
          open(os.environ['GITHUB_PATH'], 'a').write(str(pathlib.Path('resources', d).resolve()) + '\n')"

      - name: Run tests
        run: python -m pytest -q
