[tool.briefcase]
project_name = "UWMedia"
bundle = "com.mikaelchristersson"
version = "0.0.19"
license = "MIT"
license-files = ["LICENSE"]
author = "Mikael Christersson"
author_email = "mikael.christersson2@gmail.com"

# Shared by both apps. Briefcase expects a base path with no extension, and
# looks for a platform-specific file next to it: icons/uwmedia_icon.icns
# (macOS), icons/uwmedia_icon.ico (Windows), and icons/uwmedia_icon-<size>.png
# for size in 16/32/64/128/256/512 (Linux hicolor icon theme sizes).
icon = "icons/uwmedia_icon"

# Shared across every app below - concatenated with each app's own sources/requires.
sources = [
    "overlays",
    "ffmpeg",
    "gui",
    "metadata",
    "models",
    "parsers",
    "utils",
    "color.yaml",
    "hud_rules.json",
    "resources/licenses",
]
requires = [
    "pydantic>=2.0.0",
    "lxml",
    "garmin-fit-sdk",
    "numpy",
    "opencv-python",
    "pyexiftool",
    "tqdm",
    "PyYAML",
    "Pillow",
]

# Plain GUI app - what most users should download. Installs into
# /Applications on macOS (.dmg), with no terminal/CLI component.
[tool.briefcase.app.uwmedia]
formal_name = "UWMedia"
description = "Underwater media processor - GUI app"
long_description = """\
UWMedia processes underwater videos and photos: it applies underwater
color correction (a fast, FFmpeg-native 3D LUT pipeline) and can overlay
dive telemetry (depth, temperature, tank pressure, etc.) synced from
Garmin, Subsurface, or Shearwater dive logs. This is the GUI-only build,
with a color-tuning editor, EXIF/QuickTime tag editor, and a HUD layout
designer. For scripted/batch command-line use, see "UWMedia-Terminal".
"""
# cli_main.py is bundled here too, even though this build has no
# user-facing CLI (no console_app, no PATH symlink/terminal command,
# unlike uwmedia-terminal) - the GUI's own Process/Convertion "Run" button
# relaunches this app's executable with CLI args (see app.py's
# build_command()/on_run()) so processing runs in a separate, killable
# subprocess with streamed log output instead of blocking the UI thread.
# uwmedia/__main__.py's `len(sys.argv) > 1` branch imports cli_main to
# handle that relaunch, so without it here the Run button would crash
# with "ModuleNotFoundError: No module named 'cli_main'" on every
# packaged install of this app (dev/source runs never hit this, since
# cli_main.py just sits in the checkout either way). cli_main.py only
# needs modules/packages already in the shared sources/requires above -
# it doesn't need uwmedia_terminal.
sources = ["uwmedia", "cli_main.py"]
requires = ["toga"]

[tool.briefcase.app.uwmedia.macOS]
universal_build = false
requires = ["toga-cocoa"]
# Bundled ffmpeg/ffprobe/exiftool for this platform - see solve_dependencies.md
# and resources/licenses/BINARY_MANIFEST.json for provenance/versions.
sources = ["resources/bin_macos"]
# The bundled Python framework ships a config-*-darwin directory with static
# build artifacts (python.o, etc.) only needed to compile C extensions from
# source. They're unsigned Mach-O objects that Apple's notary service
# rejects, and they're not needed at runtime, so strip them before signing.
cleanup_paths = [
    "UWMedia.app/Contents/Frameworks/Python.framework/Versions/*/lib/python*/config-*-darwin",
]

# CLI + GUI hybrid app, for terminal/scripting users. Installs as a console
# app: a .pkg on macOS (into /Library/UWMedia-Terminal, with a `uwmedia`
# command symlinked onto PATH), and the same combined CLI+GUI binary on
# Windows/Linux (those platforms don't have the same "wrong folder" mismatch
# a macOS console app has with a normal /Applications install, so they only
# ship this one build).
[tool.briefcase.app.uwmedia-terminal]
formal_name = "UWMedia-Terminal"
description = "Underwater media processor - CLI + GUI app"
long_description = """\
UWMedia processes underwater videos and photos: it applies underwater
color correction (a fast, FFmpeg-native 3D LUT pipeline) and can overlay
dive telemetry (depth, temperature, tank pressure, etc.) synced from
Garmin, Subsurface, or Shearwater dive logs. This build bundles the
scriptable CLI batch-processing tool together with the same GUI as
"UWMedia" (color-tuning editor, tag editor, HUD designer) in one binary -
run it with no arguments for the GUI, or with CLI arguments for scripted/
batch use.
"""
console_app = true
sources = ["uwmedia", "cli_main.py", "uwmedia_terminal"]
requires = ["toga"]

[tool.briefcase.app.uwmedia-terminal.macOS]
universal_build = false
requires = ["toga-cocoa"]
# Bundled ffmpeg/ffprobe/exiftool for this platform - see solve_dependencies.md
# and resources/licenses/BINARY_MANIFEST.json for provenance/versions.
sources = ["resources/bin_macos"]
cleanup_paths = [
    "UWMedia-Terminal.app/Contents/Frameworks/Python.framework/Versions/*/lib/python*/config-*-darwin",
]

[tool.briefcase.app.uwmedia-terminal.windows]
# Bundled ffmpeg/ffprobe/exiftool for this platform - see solve_dependencies.md
# and resources/licenses/BINARY_MANIFEST.json for provenance/versions.
sources = ["resources/bin_windows"]
# Windows has only this one build (no separate GUI-only app like macOS), so
# there's nothing to disambiguate "Terminal" from - keep the plain name.
formal_name = "UWMedia"
# For a console_app, Briefcase names the actual .exe after the app key
# (uwmedia-terminal.exe) rather than formal_name. Override just the
# app_name used for Windows so the exe is uwmedia.exe instead - this only
# affects this platform's build, so it can't collide with the separate
# macOS-only "uwmedia" app (which Windows never builds). The "uwmedia"
# package is already a listed source either way, so Briefcase's
# module-name-must-be-in-sources check still passes, and running
# `python -m uwmedia` is equivalent to `python -m uwmedia_terminal` (the
# latter just delegates to the former).
app_name = "uwmedia"
# Without this, Briefcase defaults to a per-user install (into the user's
# profile, not Program Files) since it doesn't know which scope you want.
# This forces a per-machine install to Program Files - the installer will
# need admin/UAC elevation as a result.
system_installer = true
# The Windows template defaults to nesting under an author-name folder
# (Program Files\<author>\UWMedia\); this installs flat instead
# (Program Files\UWMedia\).
use_full_install_path = false
# Explicitly request the Start Menu shortcut. The template's own
# cookiecutter.json defaults this to true, but Briefcase only forwards
# template variables it's told about - since it never appeared at all in
# an installer log (not even a skipped/condition-failed entry), it was
# reaching the template unset rather than defaulted, so set it ourselves.
install_launcher = true

[tool.briefcase.app.uwmedia-terminal.linux]
# Same reasoning as Windows above.
formal_name = "UWMedia"
requires = ["toga-gtk"]
# Bundled ffmpeg/ffprobe/exiftool for this platform - see solve_dependencies.md
# and resources/licenses/BINARY_MANIFEST.json for provenance/versions.
sources = ["resources/bin_linux"]

[tool.briefcase.app.uwmedia-terminal.linux.system.debian]
system_requires = [
    "libcairo2-dev",
    "libgirepository-2.0-dev",
]
system_runtime_requires = [
    "gir1.2-gtk-3.0",
    "libgirepository-2.0-0",
    "libcanberra-gtk3-module",
]

[tool.briefcase.app.uwmedia-terminal.linux.system.rhel]
system_requires = [
    "cairo-gobject-devel",
    "gobject-introspection-devel",
]
system_runtime_requires = [
    "gobject-introspection",
    "gtk3",
    "libcanberra-gtk3",
]
