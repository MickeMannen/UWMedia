[tool.briefcase]
project_name = "UWMedia"
bundle = "com.mikaelchristersson"
version = "0.0.19"
license = "MIT"
author = "Mikael Christersson"
author_email = "mikael.christersson2@gmail.com"

# Shared across every app below - concatenated with each app's own sources/requires.
sources = [
    "overlays",
    "ffmpeg",
    "gui",
    "metadata",
    "models",
    "parsers",
    "utils",
    "color.yaml",
    "hud_rules.json",
    "config.yaml",
]
requires = [
    "pydantic>=2.0.0",
    "lxml",
    "garmin-fit-sdk",
    "numpy",
    "opencv-python",
    "pyexiftool",
    "tqdm",
    "PyYAML",
    "Pillow",
]

[tool.briefcase.app.uwmedia]
formal_name = "UWMedia"
description = "Underwater media processor - unified GUI + shell app"
console_app = true
sources = ["uwmedia", "cli_main.py"]
requires = ["toga"]

[tool.briefcase.app.uwmedia.macOS]
universal_build = false
requires = ["toga-cocoa"]
