[tool.briefcase]
project_name = "UWMedia"
bundle = "com.mikaelchristersson"
version = "0.0.19"
license = "MIT"
license-files = ["LICENSE"]
author = "Mikael Christersson"
author_email = "mikael.christersson2@gmail.com"

# Shared across every app below - concatenated with each app's own sources/requires.
sources = [
    "overlays",
    "ffmpeg",
    "gui",
    "metadata",
    "models",
    "parsers",
    "utils",
    "color.yaml",
    "hud_rules.json",
]
requires = [
    "pydantic>=2.0.0",
    "lxml",
    "garmin-fit-sdk",
    "numpy",
    "opencv-python",
    "pyexiftool",
    "tqdm",
    "PyYAML",
    "Pillow",
]

[tool.briefcase.app.uwmedia]
formal_name = "UWMedia"
description = "Underwater media processor - unified GUI + shell app"
console_app = true
sources = ["uwmedia", "cli_main.py"]
requires = ["toga"]

[tool.briefcase.app.uwmedia.macOS]
universal_build = false
requires = ["toga-cocoa"]

[tool.briefcase.app.uwmedia.linux]
requires = ["toga-gtk"]

[tool.briefcase.app.uwmedia.linux.system.debian]
system_requires = [
    "libcairo2-dev",
    "libgirepository-2.0-dev",
]
system_runtime_requires = [
    "gir1.2-gtk-3.0",
    "libgirepository-2.0-0",
    "libcanberra-gtk3-module",
]

[tool.briefcase.app.uwmedia.linux.system.rhel]
system_requires = [
    "cairo-gobject-devel",
    "gobject-introspection-devel",
]
system_runtime_requires = [
    "gobject-introspection",
    "gtk3",
    "libcanberra-gtk3",
]
